<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Galaxy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

   <!-- HEADER -->
<header class="bg-dark text-white">

    <div class="container py-3">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

            <!-- Logo -->
            <div class="logo">
                🚀 <span class="sneaker">Sneaker</span>
                <span class="galaxy">Galaxy</span>
            </div>

            <!-- Search -->
            <div class="w-50">
                <input type="text"
                       class="form-control"
                       placeholder="Search sneakers...">
            </div>

            <!-- Cart -->
            <div>
                <button class="btn btn-warning"
                        onclick="openCart()">

                    🛒 Cart

                </button>
            </div>

        </div>

    </div>

    <div id="navbar"></div>
    
</header>
    <!-- HERO SECTION -->
    <section class="hero">

        <div class="container">

            <h1>Step Into The Galaxy</h1>

            <button class="btn btn-light btn-lg"
                    onclick="window.location.href='nike.html'">

                Shop Now

            </button>

        </div>

    </section>

    <!-- FEATURED PRODUCTS -->
    <section class="container py-5">

        <h2 class="text-center mb-5">Featured Sneakers</h2>

        <div class="row g-4">

            <!-- Nike -->
            <div class="col-md-4">

                <div class="card product-card shadow-sm h-100">

                    <img src="images/airforce1.jpg"
                         alt="Nike Air Force 1"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">Nike Air Force 1</h5>

                        <p class="card-text fw-bold">P1500</p>

                        <button class="btn btn-primary"
                                onclick="addToCart('Nike Air Force 1', 1500)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

            <!-- Adidas -->
            <div class="col-md-4">

                <div class="card product-card shadow-sm h-100">

                    <img src="images/superstar.jpg"
                         alt="Adidas Superstar"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">Adidas Superstar</h5>

                        <p class="card-text fw-bold">P1400</p>

                        <button class="btn btn-primary"
                                onclick="addToCart('Adidas Superstar', 1400)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

            <!-- Puma -->
            <div class="col-md-4">

                <div class="card product-card shadow-sm h-100">

                    <img src="images/rsx.jpg"
                         alt="Puma RS-X"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">Puma RS-X</h5>

                        <p class="card-text fw-bold">P1300</p>

                        <button class="btn btn-primary"
                                onclick="addToCart('Puma RS-X', 1300)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- CART -->
    <section class="container py-5"
             id="cart"
             style="display: none;">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">Your Cart</h2>

                <ul id="cartItems"
                    class="list-group mb-3"></ul>

                <p class="fs-4">
                    <strong>
                        Total: P<span id="total">0</span>
                    </strong>
                </p>

                <button class="btn btn-success"
                        onclick="goToCheckout()">

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </section>

    <!-- CHECKOUT -->
    <section class="container py-5"
             id="checkout"
             style="display: none;">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">Payment Details</h2>

                <form>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control"
                               placeholder="Full Name">
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control"
                               placeholder="Card Number">
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control"
                               placeholder="Expiry Date">
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control"
                               placeholder="CVV">
                    </div>

                    <button type="button"
                            class="btn btn-primary"
                            onclick="completePurchase()">

                        Pay Now

                    </button>

                </form>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p class="mb-0">© 2026 Sneaker Galaxy</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>

</html>
