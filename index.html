<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sneaker Galaxy</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="top-bar">

      <div class="logo">
        🚀 <span class="sneaker">Sneaker</span>
        <span class="galaxy">Galaxy</span>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Search sneakers...">
      </div>

      <div>
        <button onclick="openCart()">🛒 Cart</button>
      </div>

    </div>

    <!-- NAVIGATION -->
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#brands">Brands</a></li>
        <li><a href="about.html">About</a><li>
        <li><a href="#cart">Cart</a></li>
        <li><a href="#checkout">Checkout</a></li>
      </ul>
    </nav>

  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Step Into The Galaxy</h1>
    <button>Shop Now</button>
  </section>

 <!-- BRANDS SECTION -->
<section class="section" id="brands">

  <h2>Sneaker Brands</h2>

  <!-- TAB BUTTONS -->
  <div class="tabs">

    <button class="tab-button active"
      onclick="openBrand(event, 'nike')">
      Nike
    </button>

    <button class="tab-button"
      onclick="openBrand(event, 'adidas')">
      Adidas
    </button>

    <button class="tab-button"
      onclick="openBrand(event, 'puma')">
      Puma
    </button>

    <button class="tab-button"
      onclick="openBrand(event, 'newbalance')">
      New Balance
    </button>

    <button class="tab-button"
      onclick="openBrand(event, 'jordan')">
      Jordan
    </button>

  </div>

  <!-- FEATURED PRODUCTS -->
  <section class="section">

    <h2>Featured Sneakers</h2>

    <div class="products">

      <div class="product-card">

        <img src="images/airforce1.jpg" class="shoe-img">

        <p>Nike Air Force 1</p>

        <p>P1500</p>

        <button onclick="addToCart('Nike Air Force 1',1500)">
          Add to Cart
        </button>

      </div>

      <div class="product-card">

        <img src="images/superstar.jpg" class="shoe-img">

        <p>Adidas Superstar</p>

        <p>P1400</p>

        <button onclick="addToCart('Adidas Superstar',1400)">
          Add to Cart
        </button>

      </div>

      <div class="product-card">

        <img src="images/rsx.jpg" class="shoe-img">

        <p>Puma RS-X</p>

        <p>P1300</p>

        <button onclick="addToCart('Puma RS-X',1300)">
          Add to Cart
        </button>

      </div>

    </div>

  </section>

  <!-- CART -->
  <section class="section" id="cart" style="display:none;">

    <h2>Your Cart</h2>

    <ul id="cartItems"></ul>

    <p>
      <strong>
        Total: P<span id="total">0</span>
      </strong>
    </p>

    <button onclick="goToCheckout()">
      Proceed to Checkout
    </button>

  </section>

  <!-- CHECKOUT -->
  <section class="section" id="checkout" style="display:none;">

    <h2>Payment Details</h2>

    <input type="text" placeholder="Full Name">
    <br><br>

    <input type="text" placeholder="Card Number">
    <br><br>

    <input type="text" placeholder="Expiry Date">
    <br><br>

    <input type="text" placeholder="CVV">
    <br><br>

    <button onclick="completePurchase()">
      Pay Now
    </button>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© Sneaker Galaxy</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
