<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Puma | Sneaker Galaxy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HEADER -->
    <header class="bg-dark text-white text-center py-5">

        <div class="container">

            <h1 class="fw-bold text-warning">
                Puma
            </h1>

            <p>
                <strong>Founded:</strong> 1948
            </p>

            <p>
                <strong>Founder:</strong>
                Rudolf Dassler
            </p>

            <p>
                <strong>Popular Sneakers:</strong>
                RS-X, Suede Classic,
                Future Rider, Clyde
            </p>

            <p>
                Puma combines performance
                and fashion culture.
            </p>

        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main class="container py-5">

        <h2 class="text-center mb-5">
            In Stock
        </h2>

        <!-- PRODUCTS -->
        <div class="row g-4">

            <!-- PUMA RS-X -->
            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm h-100 product-item">

                    <img src="images/rsx.jpg"
                         alt="Puma RS-X"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Puma RS-X
                        </h5>

                        <p class="fw-bold">
                            P1300
                        </p>

                        <label for="rsx-color"
                               class="form-label">

                            Choose Color

                        </label>

                        <select id="rsx-color"
                                class="form-select mb-3">

                            <option value="White/Blue">
                                White/Blue
                            </option>

                            <option value="Black/Red">
                                Black/Red
                            </option>

                            <option value="Triple White">
                                Triple White
                            </option>

                        </select>

                        <button class="btn btn-warning w-100"
                                onclick="addToCart('Puma RS-X', 1300, document.getElementById('rsx-color').value)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

            <!-- PUMA SUEDE CLASSIC -->
            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm h-100 product-item">

                    <img src="images/suedeclassic.jpg"
                         alt="Puma Suede Classic"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Puma Suede Classic
                        </h5>

                        <p class="fw-bold">
                            P1200
                        </p>

                        <label for="suede-color"
                               class="form-label">

                            Choose Color

                        </label>

                        <select id="suede-color"
                                class="form-select mb-3">

                            <option value="Black/White">
                                Black/White
                            </option>

                            <option value="Red/White">
                                Red/White
                            </option>

                            <option value="Blue/White">
                                Blue/White
                            </option>

                        </select>

                        <button class="btn btn-warning w-100"
                                onclick="addToCart('Puma Suede Classic', 1200, document.getElementById('suede-color').value)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

            <!-- PUMA FUTURE RIDER -->
            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm h-100 product-item">

                    <img src="images/futurerider.jpg"
                         alt="Puma Future Rider"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Puma Future Rider
                        </h5>

                        <p class="fw-bold">
                            P1500
                        </p>

                        <label for="rider-color"
                               class="form-label">

                            Choose Color

                        </label>

                        <select id="rider-color"
                                class="form-select mb-3">

                            <option value="Grey/Orange">
                                Grey/Orange
                            </option>

                            <option value="Blue/White">
                                Blue/White
                            </option>

                            <option value="Black">
                                Black
                            </option>

                        </select>

                        <button class="btn btn-warning w-100"
                                onclick="addToCart('Puma Future Rider', 1500, document.getElementById('rider-color').value)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

            <!-- PUMA CLYDE -->
            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm h-100 product-item">

                    <img src="images/clyde.jpg"
                         alt="Puma Clyde"
                         class="card-img-top shoe-img">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Puma Clyde
                        </h5>

                        <p class="fw-bold">
                            P1400
                        </p>

                        <label for="clyde-color"
                               class="form-label">

                            Choose Color

                        </label>

                        <select id="clyde-color"
                                class="form-select mb-3">

                            <option value="Black">
                                Black
                            </option>

                            <option value="White">
                                White
                            </option>

                            <option value="Green">
                                Green
                            </option>

                        </select>

                        <button class="btn btn-warning w-100"
                                onclick="addToCart('Puma Clyde', 1400, document.getElementById('clyde-color').value)">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-3 mt-5 border-top border-warning">

        <p class="mb-0">
            © 2026 Sneaker Galaxy
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- NAVBAR LOADER -->
    <script>
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            });
    </script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>

</html>
