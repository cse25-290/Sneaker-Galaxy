<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Puma | Sneaker Galaxy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

    <header class="bg-dark text-white shadow">

        <div class="container py-3">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

                <div class="logo">
                    🚀 <span class="sneaker">Sneaker</span>
                    <span class="galaxy">Galaxy</span>
                </div>

                <div class="w-50">
                    <input type="text"
                           class="form-control"
                           placeholder="Search sneakers...">
                </div>

                <div>
                    <button class="btn btn-warning"
                            onclick="openCart()">

                        🛒 Cart

                    </button>
                </div>

            </div>

        </div>

    </header>

    <main class="container py-5">

        <section id="puma"
                 class="tab-content">

            <div class="product-card shadow">

                <div class="text-center mb-5">

                    <h1 class="fw-bold">
                        Puma
                    </h1>

                    <p>
                        <strong>Founded:</strong> 1948
                    </p>

                    <p>
                        <strong>Founder:</strong>
                        Rudolf Dassler
                    </p>

                    <p>
                        <strong>Popular Sneakers:</strong>
                        RS-X, Suede Classic,
                        Future Rider, Clyde
                    </p>

                    <p>
                        Puma combines performance
                        and fashion culture.
                    </p>

                </div>

                <h2 class="text-center mb-4">
                    In Stock
                </h2>

                <div class="products-container">

                    <div class="card shadow-sm product-item">

                        <img src="images/rsx.jpg"
                             alt="Puma RS-X"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Puma RS-X
                            </h5>

                            <p class="fw-bold">
                                P1300
                            </p>

                            <label for="rsx-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="rsx-color"
                                    class="form-select mb-3">

                                <option value="White/Blue">
                                    White/Blue
                                </option>

                                <option value="Black/Red">
                                    Black/Red
                                </option>

                                <option value="Triple White">
                                    Triple White
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('Puma RS-X', 1300, document.getElementById('rsx-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/suedeclassic.jpg"
                             alt="Puma Suede Classic"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Puma Suede Classic
                            </h5>

                            <p class="fw-bold">
                                P1200
                            </p>

                            <label for="suede-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="suede-color"
                                    class="form-select mb-3">

                                <option value="Black/White">
                                    Black/White
                                </option>

                                <option value="Red/White">
                                    Red/White
                                </option>

                                <option value="Blue/White">
                                    Blue/White
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('Puma Suede Classic', 1200, document.getElementById('suede-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/futurerider.jpg"
                             alt="Puma Future Rider"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Puma Future Rider
                            </h5>

                            <p class="fw-bold">
                                P1500
                            </p>

                            <label for="rider-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="rider-color"
                                    class="form-select mb-3">

                                <option value="Grey/Orange">
                                    Grey/Orange
                                </option>

                                <option value="Blue/White">
                                    Blue/White
                                </option>

                                <option value="Black">
                                    Black
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('Puma Future Rider', 1500, document.getElementById('rider-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/clyde.jpg"
                             alt="Puma Clyde"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Puma Clyde
                            </h5>

                            <p class="fw-bold">
                                P1400
                            </p>

                            <label for="clyde-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="clyde-color"
                                    class="form-select mb-3">

                                <option value="Black">
                                    Black
                                </option>

                                <option value="White">
                                    White
                                </option>

                                <option value="Green">
                                    Green
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('Puma Clyde', 1400, document.getElementById('clyde-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p class="mb-0">
            © 2026 Sneaker Galaxy
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
