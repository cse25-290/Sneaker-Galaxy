<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Balance | Sneaker Galaxy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HEADER -->
    <header class="bg-dark text-white py-5 text-center shadow">

        <div class="container">

            <h1 class="fw-bold text-warning">
                New Balance
            </h1>

            <p>
                <strong>Founded:</strong> 1906
            </p>

            <p>
                <strong>Founder:</strong>
                William J. Riley
            </p>

            <p>
                <strong>Popular Sneakers:</strong>
                990 Series, 574, 550, 2002R
            </p>

            <p>
                New Balance is known for comfort and quality.
            </p>

        </div>

    </header>

    <!-- MAIN -->
    <main class="container py-5">

        <section id="newbalance">

            <h2 class="text-center mb-5 text-warning">
                In Stock
            </h2>

            <!-- PRODUCTS -->
            <div class="row g-4">

                <!-- NEW BALANCE 574 -->
                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 product-item">

                        <img src="images/nb574.jpg"
                             alt="New Balance 574"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 574
                            </h5>

                            <p class="fw-bold">
                                P1800
                            </p>

                            <label for="nb574-color"
                                   class="form-label">

                                Choose Color

                            </label>

                            <select id="nb574-color"
                                    class="form-select mb-3">

                                <option value="Grey">Grey</option>
                                <option value="Navy">Navy</option>
                                <option value="Black">Black</option>

                            </select>

                            <button class="btn btn-warning w-100"
                                    onclick="addToCart('New Balance 574', 1800, document.getElementById('nb574-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

                <!-- NEW BALANCE 990 -->
                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 product-item">

                        <img src="images/nb990.jpg"
                             alt="New Balance 990"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 990
                            </h5>

                            <p class="fw-bold">
                                P2200
                            </p>

                            <label for="nb990-color"
                                   class="form-label">

                                Choose Color

                            </label>

                            <select id="nb990-color"
                                    class="form-select mb-3">

                                <option value="Grey">Grey</option>
                                <option value="Black">Black</option>
                                <option value="Navy">Navy</option>

                            </select>

                            <button class="btn btn-warning w-100"
                                    onclick="addToCart('New Balance 990', 2200, document.getElementById('nb990-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

                <!-- NEW BALANCE 550 -->
                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 product-item">

                        <img src="images/nb550.jpg"
                             alt="New Balance 550"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 550
                            </h5>

                            <p class="fw-bold">
                                P2000
                            </p>

                            <label for="nb550-color"
                                   class="form-label">

                                Choose Color

                            </label>

                            <select id="nb550-color"
                                    class="form-select mb-3">

                                <option value="White/Green">White/Green</option>
                                <option value="White/Red">White/Red</option>
                                <option value="White/Blue">White/Blue</option>

                            </select>

                            <button class="btn btn-warning w-100"
                                    onclick="addToCart('New Balance 550', 2000, document.getElementById('nb550-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

                <!-- NEW BALANCE 2002R -->
                <div class="col-md-6 col-lg-3">

                    <div class="card shadow-sm h-100 product-item">

                        <img src="images/nb2002r.jpg"
                             alt="New Balance 2002R"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 2002R
                            </h5>

                            <p class="fw-bold">
                                P2400
                            </p>

                            <label for="nb2002r-color"
                                   class="form-label">

                                Choose Color

                            </label>

                            <select id="nb2002r-color"
                                    class="form-select mb-3">

                                <option value="Rain Cloud">Rain Cloud</option>
                                <option value="Black">Black</option>
                                <option value="Protection Pack">Protection Pack</option>

                            </select>

                            <button class="btn btn-warning w-100"
                                    onclick="addToCart('New Balance 2002R', 2400, document.getElementById('nb2002r-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-3 mt-5 border-top border-warning">

        <p class="mb-0">
            © 2026 Sneaker Galaxy
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- NAVBAR LOADER -->
    <script>
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            });
    </script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>

</html>
