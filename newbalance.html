<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Balance | Sneaker Galaxy</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

    <header class="bg-dark text-white shadow">

        <div class="container py-3">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

                <div class="logo">
                    🚀 <span class="sneaker">Sneaker</span>
                    <span class="galaxy">Galaxy</span>
                </div>

                <div class="w-50">
                    <input type="text"
                           class="form-control"
                           placeholder="Search sneakers...">
                </div>

                <div>
                    <button class="btn btn-warning"
                            onclick="openCart()">

                        🛒 Cart

                    </button>
                </div>

            </div>

        </div>

    </header>

    <main class="container py-5">

        <section id="newbalance"
                 class="tab-content">

            <div class="product-card shadow">

                <div class="text-center mb-5">

                    <h1 class="fw-bold">
                        New Balance
                    </h1>

                    <p>
                        <strong>Founded:</strong> 1906
                    </p>

                    <p>
                        <strong>Founder:</strong>
                        William J. Riley
                    </p>

                    <p>
                        <strong>Popular Sneakers:</strong>
                        990 Series, 574, 550, 2002R
                    </p>

                    <p>
                        New Balance is known for comfort and quality.
                    </p>

                </div>

                <h2 class="text-center mb-4">
                    In Stock
                </h2>

                <div class="products-container">

                    <div class="card shadow-sm product-item">

                        <img src="images/nb574.jpg"
                             alt="New Balance 574"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 574
                            </h5>

                            <p class="fw-bold">
                                P1800
                            </p>

                            <label for="nb574-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="nb574-color"
                                    class="form-select mb-3">

                                <option value="Grey">
                                    Grey
                                </option>

                                <option value="Navy">
                                    Navy
                                </option>

                                <option value="Black">
                                    Black
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('New Balance 574', 1800, document.getElementById('nb574-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/nb990.jpg"
                             alt="New Balance 990"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 990
                            </h5>

                            <p class="fw-bold">
                                P2200
                            </p>

                            <label for="nb990-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="nb990-color"
                                    class="form-select mb-3">

                                <option value="Grey">
                                    Grey
                                </option>

                                <option value="Black">
                                    Black
                                </option>

                                <option value="Navy">
                                    Navy
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('New Balance 990', 2200, document.getElementById('nb990-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/nb550.jpg"
                             alt="New Balance 550"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 550
                            </h5>

                            <p class="fw-bold">
                                P2000
                            </p>

                            <label for="nb550-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="nb550-color"
                                    class="form-select mb-3">

                                <option value="White/Green">
                                    White/Green
                                </option>

                                <option value="White/Red">
                                    White/Red
                                </option>

                                <option value="White/Blue">
                                    White/Blue
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('New Balance 550', 2000, document.getElementById('nb550-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                    <div class="card shadow-sm product-item">

                        <img src="images/nb2002r.jpg"
                             alt="New Balance 2002R"
                             class="card-img-top shoe-img">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                New Balance 2002R
                            </h5>

                            <p class="fw-bold">
                                P2400
                            </p>

                            <label for="nb2002r-color"
                                   class="form-label">

                                Choose Color:

                            </label>

                            <select id="nb2002r-color"
                                    class="form-select mb-3">

                                <option value="Rain Cloud">
                                    Rain Cloud
                                </option>

                                <option value="Black">
                                    Black
                                </option>

                                <option value="Protection Pack">
                                    Protection Pack
                                </option>

                            </select>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart('New Balance 2002R', 2400, document.getElementById('nb2002r-color').value)">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p class="mb-0">
            © 2026 Sneaker Galaxy
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
