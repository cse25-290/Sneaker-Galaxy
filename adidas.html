<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adidas | Sneaker Galaxy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- HEADER -->
<header class="bg-dark text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Adidas</h1>
        <p>Sportswear & Streetwear Legend</p>
    </div>
</header>

<!-- CONTENT -->
<section class="container py-5">

    <div class="row g-4">

        <!-- Superstar -->
        <div class="col-md-3">
            <div class="card shadow h-100">
                <img src="images/superstar.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Adidas Superstar</h5>
                    <p class="fw-bold">P1400</p>

                    <select id="superstar" class="form-select mb-2">
                        <option>White/Black</option>
                        <option>Black/White</option>
                        <option>Triple White</option>
                    </select>

                    <button class="btn btn-primary w-100"
                            onclick="addToCart('Adidas Superstar', 1400, document.getElementById('superstar').value)">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Stan Smith -->
        <div class="col-md-3">
            <div class="card shadow h-100">
                <img src="images/stansmith.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Stan Smith</h5>
                    <p class="fw-bold">P1600</p>

                    <select id="stan" class="form-select mb-2">
                        <option>White/Green</option>
                        <option>White/Navy</option>
                        <option>Triple White</option>
                    </select>

                    <button class="btn btn-primary w-100"
                            onclick="addToCart('Stan Smith', 1600, document.getElementById('stan').value)">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Ultraboost -->
        <div class="col-md-3">
            <div class="card shadow h-100">
                <img src="images/ultraboost.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Ultraboost</h5>
                    <p class="fw-bold">P2200</p>

                    <select id="boost" class="form-select mb-2">
                        <option>Black</option>
                        <option>White</option>
                        <option>Grey</option>
                    </select>

                    <button class="btn btn-primary w-100"
                            onclick="addToCart('Ultraboost', 2200, document.getElementById('boost').value)">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <!-- Yeezy -->
        <div class="col-md-3">
            <div class="card shadow h-100">
                <img src="images/yeezy350.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Yeezy 350</h5>
                    <p class="fw-bold">P3500</p>

                    <select id="yeezy" class="form-select mb-2">
                        <option>Zebra</option>
                        <option>Black</option>
                        <option>Cream</option>
                    </select>

                    <button class="btn btn-primary w-100"
                            onclick="addToCart('Yeezy 350', 3500, document.getElementById('yeezy').value)">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

    </div>

</section>

<!-- FOOTER -->
<footer class="text-center p-3 bg-dark text-white mt-5">
    © 2026 Sneaker Galaxy
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- NAVBAR LOADER -->
<script>
fetch("navbar.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById("navbar").innerHTML = data;
    });
</script>

<script src="script.js"></script>

</body>
</html>
