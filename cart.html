<!DOCTYPE html>
<html>

<head>

<title>Sneaker Galaxy Cart</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family: Arial, sans-serif;
padding:20px;
background: url("jordan6.jpg") no-repeat center center fixed;
background-size: cover;
color: white;
}

header{
text-align:center;
margin-bottom:30px;
color: white;
}

#cart-items{
color:white;
}

#total{
color:white;
}
</style>

</head>

<body>

<header>

<h1>🛒 Sneaker Galaxy Checkout</h1>

</header>

<!-- CART ITEMS -->
<div id="cart-items"></div>

<h2 id="total"></h2>

<button class="btn btn-primary"
onclick="showCheckout()">
Checkout
</button>

<!-- CHECKOUT SECTION -->
<section id="checkout">

<div class="card">

<h2>Payment Details</h2>

<form>

<input
type="text"
class="form-control"
id="fullname"
placeholder="Full Name"
required>

<input
type="text"
class="form-control"
id="card"
placeholder="Card Number"
required>

<input
type="text"
class="form-control"
id="expiry"
placeholder="Expiry Date"
required>

<input
type="text"
class="form-control"
id="cvv"
placeholder="CVV"
required>

<button
type="button"
class="btn btn-primary"
onclick="completePurchase()">

Pay Now

</button>

</form>

</div>

</section>

<script>

let cart =
JSON.parse(
localStorage.getItem("cart")
)||[];

let output="";
let total=0;

cart.forEach(item=>{

output += `
<p>
${item.name}
- P${item.price}
</p>
`;

total += item.price;

});

document.getElementById(
"cart-items"
).innerHTML=output;

document.getElementById(
"total"
).innerHTML=
"Total: P"+total;


// SHOW CHECKOUT FORM
function showCheckout(){

if(cart.length===0){

alert(
"Your cart is empty!"
);

return;

}

document
.getElementById(
"checkout"
)
.style.display=
"block";

}


// COMPLETE PURCHASE
function completePurchase(){

let name =
document
.getElementById(
"fullname"
).value;

let card =
document
.getElementById(
"card"
).value;

let expiry =
document
.getElementById(
"expiry"
).value;

let cvv =
document
.getElementById(
"cvv"
).value;

if(
!name ||
!card ||
!expiry ||
!cvv
){

alert(
"Please fill all payment fields."
);

return;

}

alert(
"Payment successful! Thank you for shopping at Sneaker Galaxy 🚀"
);

localStorage.removeItem(
"cart"
);

window.location.href=
"index.html";

}

</script>

</body>

</html>
