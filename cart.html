<!DOCTYPE html>
<html>

<head>

<title>Sneaker Galaxy Cart</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<style>

body{
font-family:Arial;
margin:0;
}

header{
background:black;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

nav a{
color:white;
margin:10px;
text-decoration:none;
}

button{
background:#0d6efd;
color:white;

border:none;

padding:10px;

cursor:pointer;
}

.shoe{
padding:20px;
}
</style>

<header>

<h1>🛒 Sneaker Galaxy Checkout</h1>

</header>

<div id="cart-items"></div>

<h2 id="total"></h2>

<button onclick="checkout()">
Checkout
</button>

<script>

let cart =
JSON.parse(
localStorage.getItem("cart")
)||[];

let output="";
let total=0;

cart.forEach(item=>{

output += `
<p>
${item.name}
- P${item.price}
</p>
`;

total += item.price;

});

document.getElementById(
"cart-items"
).innerHTML=output;

document.getElementById(
"total"
).innerHTML=
"Total: P"+total;

function checkout(){

alert(
"Order placed!"
);

localStorage.removeItem(
"cart"
);

location.reload();

}

</script>

</body>

</html>
